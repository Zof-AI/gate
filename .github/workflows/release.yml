name: Release
# Manual only, from main, through the `release` environment (required reviewers). npm uses trusted
# publishing over OIDC with provenance, so no npm token exists anywhere; the image is signed with
# cosign keyless and carries GitHub's SLSA build provenance. publish=false builds and checks a
# candidate without publishing anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal package.json (for example 1.0.0)
        required: true
        type: string
      publish:
        description: Publish to npm and GHCR and move the major tag (false checks a candidate only)
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/zof-ai/gate
  VERSION: ${{ inputs.version }}
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Check the requested version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be x.y.z"
            exit 1
          fi
          actual="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$actual" ]; then
            echo "::error::Requested version $VERSION does not match package.json version $actual"
            exit 1
          fi
      - name: Check the version is above the highest release on npm
        # Compares against the highest x.y.z among all published versions; prereleases and the
        # staged 0.0.0-stage placeholder are ignored, and a missing package (E404) allows any.
        run: node scripts/version-check.mjs @zof-ai/gate "$VERSION"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check dist/ is current
        run: npm run bundle:check
      - run: npm run build
      - name: Pack
        id: pack
        run: |
          mkdir -p dist-pack
          tarball="$(npm pack --ignore-scripts --pack-destination dist-pack | tail -n 1)"
          sha256="$(sha256sum "./dist-pack/$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball sha256 $sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Install npm 11.5+ (same npm as the publish job)
        run: npm install --global --ignore-scripts npm@11.21.1
      - name: Dry-run the publish of the packed tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "./dist-pack/$TARBALL" --dry-run --access public
      - name: Build the image
        run: docker build --build-arg "VERSION=$VERSION" -t zof-gate:candidate .
      - name: Smoke-test the image
        run: |
          test "$(docker run --rm zof-gate:candidate zof-gate --version)" = "$VERSION"
          test "$(docker run --rm zof-gate:candidate id -u)" != "0"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-tarball
          path: dist-pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  # Publishes the exact tarball checked above; only this job can mint the OIDC token that npm
  # trusted publishing exchanges for a short-lived publish token.
  npm:
    needs: candidate
    if: inputs.publish && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install npm 11.5+ (required for trusted publishing)
        run: npm install --global --ignore-scripts npm@11.21.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: npm-tarball
          path: dist-pack
      - name: Verify the tarball is the one that was checked
        env:
          TARBALL: ${{ needs.candidate.outputs.tarball }}
          EXPECTED: ${{ needs.candidate.outputs.sha256 }}
        run: echo "$EXPECTED  ./dist-pack/$TARBALL" | sha256sum --check --strict
      - name: Publish with provenance
        env:
          TARBALL: ${{ needs.candidate.outputs.tarball }}
        # The ./ prefix matters: npm reads "dist-pack/x.tgz" as GitHub shorthand, not a file.
        run: npm publish "./dist-pack/$TARBALL" --access public --provenance
      - name: Verify the published package's signatures and provenance
        # The registry can take minutes to show a new version, so wait up to ~5 minutes for it;
        # a version that never appears, or signatures that don't verify, still fail the job.
        run: |
          shown=""
          for _ in $(seq 1 20); do
            shown="$(npm view "@zof-ai/gate@$VERSION" version 2>/dev/null || true)"
            [ "$shown" = "$VERSION" ] && break
            echo "Waiting for @zof-ai/gate@$VERSION to appear on the registry"
            sleep 15
          done
          if [ "$shown" != "$VERSION" ]; then
            echo "::error::@zof-ai/gate@$VERSION did not appear on the registry within 5 minutes"
            exit 1
          fi
          mkdir verify && cd verify && npm init -y >/dev/null
          installed=""
          for _ in 1 2 3 4 5 6; do
            npm install --ignore-scripts "@zof-ai/gate@$VERSION" && installed=yes && break
            sleep 10
          done
          if [ -z "$installed" ]; then
            echo "::error::Could not install @zof-ai/gate@$VERSION from the registry"
            exit 1
          fi
          npm audit signatures

  image:
    needs: candidate
    if: inputs.publish && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      COSIGN_VERSION: v3.1.4
      COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install cosign (checksum-verified binary)
        run: |
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  cosign" | sha256sum --check --strict
          sudo install -m 0755 cosign /usr/local/bin/cosign
          rm cosign
      - name: Build and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"
          docker build --build-arg "VERSION=$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$minor" -t "$IMAGE:$major" .
          for tag in "$VERSION" "$minor" "$major"; do docker push "$IMAGE:$tag"; done
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          digest="${ref##*@}"
          case "$digest" in sha256:*) ;; *) echo "::error::No digest for the pushed image"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/zof-ai/gate
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify the signature and the provenance
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Runs only after both publishes passed, so a tag never points at a release that isn't out.
  tag:
    needs: [npm, image]
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag v${{ inputs.version }} and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          major="v${VERSION%%.*}"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f "sha=$SHA" -F force=true
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$major" -f "sha=$SHA"
          fi
      - name: Write the release notes with the image digest
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          major="${VERSION%%.*}"
          {
            echo "npm: \`@zof-ai/gate@$VERSION\` (with provenance)"
            echo
            echo "Image: \`$IMAGE:$major@$DIGEST\`"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity https://github.com/$WORKFLOW_REF \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "npm audit signatures"
            echo '```'
          } > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --notes-file notes.md --verify-tag
